name: Repository privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/privacy-check.mjs --tracked
      - run: node scripts/privacy-check.mjs --history
      - run: node scripts/test-privacy.mjs
      - run: node scripts/test-test-paths.mjs
